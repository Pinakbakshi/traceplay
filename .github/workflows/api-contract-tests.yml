name: TracePlay API contract tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  api-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run API contract validator tests
        run: python -m unittest tests.unit.test_api_contract -v
      - name: Validate CLI entry point
        run: python test_api_contract.py --help
